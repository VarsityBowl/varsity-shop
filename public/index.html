    const timeToMin = (t) => {
      const m = /(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(str(t));
      if (!m) return 24 * 60;
      return (parseInt(m[1], 10) % 12 + (/pm/i.test(m[3]) ? 12 : 0)) * 60 + parseInt(m[2], 10);
    };
    const sortKey = (g) => {
      const t = gameStartMs(g);
      if (t != null) return t;
      const d = g.rawDate ? Date.parse(g.rawDate + "T23:59:59Z") : NaN;   // TBA → akhir hari
      return isNaN(d) ? Infinity : d;
    };
    const byDate = (a, b) => {
      const ka = sortKey(a), kb = sortKey(b);

      new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit",

      return Date.UTC(+o.year, +o.month - 1, +o.day, +o.hour, +o.minute, +o.second) - utcMs;
    };
    const zonedToUtcMs = (rawDate, hh, mm, tz) => {
      const [y, mo, d] = rawDate.split("-").map(Number);
      const wall = Date.UTC(y, mo - 1, d, hh, mm);
      let t = wall - tzOffsetMs(wall, tz);
      t = wall - tzOffsetMs(t, tz);
      return t;
    };

        return isNaN(t) ? null : t;
      } catch (e) { return null; }
    };

          LOGO_MISSING[k] = true;
          return "";

        let alive = true;
        if (!key) { setData(""); return; }
        const c = getCachedLogo(key);
        if (c) { setData(c); return; }
        setData("");
        fetchLogo(key).then((d) => { if (alive && d) setData(d); });
        return () => { alive = false; };
      }, [key]);
      if (data) {
        return <img src={data} alt={name} decoding="async" className={cls + " object-contain bg-white p-0.5"} />;
      }
      return <div className={cls + " " + fallbackCls + " flex items-center justify-center text-[11px] font-black"}>{initials(name)}</div>;
    };

    // ---- ICONS ----
    const Icon = ({d, extra}) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
           className={extra}>{d}</svg>
    );
    const IcActivity = ({c}) => <Icon extra={c} d={<path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>}/>;
    const IcChevron  = ({c}) => <Icon extra={c} d={<path d="m6 9 6 6 6-6"/>}/>;
    const IcClock    = ({c}) => <Icon extra={c} d={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>}/>;
    const IcFlame    = ({c}) => <Icon extra={c} d={<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>}/>;
    const IcMap      = ({c}) => <Icon extra={c} d={<><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></>}/>;
    const IcPlay     = ({c}) => <Icon extra={c} d={<polygon points="6 3 20 12 6 21 6 3"/>}/>;
    const IcSearch   = ({c}) => <Icon extra={c} d={<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>}/>;

    // Normalisasi teks untuk pencarian: tanpa aksen/tanda baca, huruf kecil ("St. John Bosco" = "st john bosco")
    const norm = (v) => String(v == null ? "" : v).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

    const SearchBox = ({ value, onChange, onSubmit, placeholder, wrapCls, inputCls }) => (
      <div className={"relative " + wrapCls}>
        <IcSearch c="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-gray-500 pointer-events-none"/>
        <input aria-label="Search games" type="text" inputMode="search" enterKeyHint="search"
          autoComplete="off" autoCorrect="off" spellCheck={false}
          value={value} onChange={e => onChange(e.target.value)}
          onKeyDown={e => {
            if (e.key === "Enter") { e.preventDefault(); if (onSubmit) onSubmit(); e.currentTarget.blur(); }
            else if (e.key === "Escape") onChange("");
          }}
          placeholder={placeholder}
          className={"pl-9 pr-9 py-2 rounded-full bg-white border border-gray-300 focus:outline-none focus:border-[#f97316] placeholder:text-gray-400 shadow-sm " + inputCls}/>
        {value && (
          <button type="button" aria-label="Clear search" onClick={() => onChange("")}
            className="absolute right-2 top-1/2 -translate-y-1/2 h-6 w-6 rounded-full text-gray-600 hover:text-[#f97316] hover:bg-gray-100 flex items-center justify-center text-[18px] leading-none">×</button>
        )}
      </div>
    );
    const IcStar     = ({c}) => <Icon extra={c} d={<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>}/>;
    const IcTrophy   = ({c}) => <Icon extra={c} d={<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></>}/>;
    const IcUsers    = ({c}) => <Icon extra={c} d={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>}/>;

    const BADGE = {
      live:       "bg-orange-50 border-orange-200 text-orange-700",
      connecting: "bg-gray-100 border-gray-300 text-gray-600",
      error:      "bg-red-50 border-red-200 text-red-600",
      demo:       "bg-yellow-50 border-yellow-300 text-yellow-700"
    };

    const sportBadgeClass = (sport) =>
      sport === "BASKETBALL" ? "bg-orange-50 text-orange-700 border-orange-200"
      : "bg-gray-100 text-zinc-800 border-gray-300";

    // ---- DATA HOOK ----
    // Tiga sumber kecil (bukan satu query raksasa):
    //  1) feed    → jadwal kronologis per halaman; filter sport/state dikerjakan SERVER
    //  2) topPool → game prestige tertinggi (untuk Top 10)
    //  3) count   → total game di window (getCountFromServer ≈ 1 read / 1000 dokumen)
    // Filter di server butuh composite index. Kalau belum dibuat, otomatis jatuh ke filter sisi klien
    // dan link pembuatan index dicetak di console (console.warn).
    const mergeUnique = (...lists) => {
      const seen = new Set(), out = [];
      lists.forEach(l => l.forEach(g => { if (!seen.has(g.id)) { seen.add(g.id); out.push(g); } }));
      return out;
    };
    const mergeCatalog = (prev, games) => {
      const cs = {}, ct = {};
      games.forEach(g => {
        if (g.sport) cs[g.sport] = (cs[g.sport] || 0) + 1;
        if (STATE_NAMES[g.state]) ct[g.state] = (ct[g.state] || 0) + 1;
      });
      let changed = false;
      const sports = { ...prev.sports }, states = { ...prev.states };
      Object.keys(cs).forEach(k => { if (!(sports[k] >= cs[k])) { sports[k] = cs[k]; changed = true; } });
      Object.keys(ct).forEach(k => { if (!(states[k] >= ct[k])) { states[k] = ct[k]; changed = true; } });
      return changed ? { sports, states } : prev;
    };
    const titleCase = (t) => t.toLowerCase().replace(/(^|[\s.\-(])([a-z])/g, (m, a, b) => a + b.toUpperCase());
    const docsToGames = (snap) => snap.docs
      .filter(d => !HIDE_LEGACY_DOCS || d.data().schemaVersion)
      .map(d => normalizeGame(d.id, d.data()));

    function useGames(sport, stateF, today, search) {
      const demo = useMemo(() => DEMO_MODE ? DEMO_ALL.map(g => normalizeGame(g.id, g)) : [], []);
      const [lib, setLib] = useState(null);
      const [status, setStatus] = useState(DEMO_MODE ? "demo" : "connecting");
      const [feed, setFeed] = useState(demo);
      const [more, setMore] = useState(false);
      const [topPool, setTopPool] = useState([]);
      const [topReady, setTopReady] = useState(DEMO_MODE);
      const [searchDocs, setSearchDocs] = useState([]);
      const [total, setTotal] = useState(null);
      const [totalAll, setTotalAll] = useState(null);
      const [catalog, setCatalog] = useState(() => mergeCatalog({ sports: {}, states: {} }, demo));
      const [noIndex, setNoIndex] = useState({});
      const [lim, setLim] = useState({ key: "", n: FEED_PAGE });

      const key = sport + "|" + stateF;
      const keyRef = React.useRef(key); keyRef.current = key;
      // Filter efektif per query: bila index-nya belum ada → ALL (difilter di klien)
      const eff = (kind) => noIndex[key + "|" + kind] ? ["ALL", "ALL"] : [sport, stateF];
      const [fS, fT] = eff("feed"), [tS, tT] = eff("top"), [cS, cT] = eff("count");
      const feedN = lim.key === key ? lim.n : FEED_PAGE;
      const loadMore = () => setLim({ key, n: Math.min(FEED_MAX, feedN + FEED_PAGE) });

      const fail = (kind) => (err) => {
        if (err && err.code === "failed-precondition" && /index/i.test(String(err.message))) {
          console.warn("[Varsity Bowl] Query '" + kind + "' butuh composite index Firestore — sementara filter dikerjakan di sisi klien. Buat index lewat link ini:\n" + err.message);
          const k = keyRef.current + "|" + kind;
          setNoIndex(p => (p[k] ? p : { ...p, [k]: true }));
        } else {
          console.error("[Varsity Bowl] Firestore error (" + kind + "):", err);
          if (kind === "feed") setStatus("error");
        }
      };
      const col = (L) => L.collection(L.db, "schedules_all");
      const filt = (L, s, t) => [].concat(
        s !== "ALL" ? [L.where("sport", "==", s)] : [],
        t !== "ALL" ? [L.where("state", "==", t)] : []);

      // 0) init Firebase
      useEffect(() => {
        if (DEMO_MODE) return;
        let cancelled = false;
        (async () => {
          try {
            const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js");
            const m = await import("https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js");
            if (cancelled) return;
            const db = m.getFirestore(initializeApp(FIREBASE_CONFIG));
            const L = { db, collection: m.collection, query: m.query, where: m.where, orderBy: m.orderBy, limit: m.limit,
                        onSnapshot: m.onSnapshot, getDocs: m.getDocs, doc: m.doc, getDoc: m.getDoc, getCountFromServer: m.getCountFromServer };
            fsReadyResolve(L);        // dipakai fetchLogo
            setLib(L);
          } catch (e) {
            console.error("[Varsity Bowl] Firebase init error:", e);
            setStatus("error");
          }
        })();
        return () => { cancelled = true; };
      }, []);

      // 1) feed: jadwal kronologis (rawDate window) + filter server
      useEffect(() => {
        if (!lib) return;
        const q = lib.query(col(lib),
          lib.where("rawDate", ">=", today), lib.where("rawDate", "<=", dayPlus(today, WINDOW_DAYS)),
          ...filt(lib, fS, fT), lib.orderBy("rawDate"), lib.limit(feedN));
        const unsub = lib.onSnapshot(q, (snap) => {
          const games = docsToGames(snap);
          setFeed(games);
          setMore(snap.size >= feedN && feedN < FEED_MAX);
          setStatus("live");
          setCatalog(p => mergeCatalog(p, games));
          console.log("[Varsity Bowl] feed: " + snap.size + " dokumen (limit " + feedN + ").");
        }, fail("feed"));
        return () => unsub();
      }, [lib, today, fS, fT, feedN]);

      // 2) kandidat Top 10: prestige tertinggi (window tanggal dipotong di klien)
      useEffect(() => {
        if (!lib) return;
        const q = lib.query(col(lib), ...filt(lib, tS, tT), lib.orderBy("prestige", "desc"), lib.limit(TOP_POOL));
        const unsub = lib.onSnapshot(q, (snap) => {
          setTopPool(docsToGames(snap)); setTopReady(true);
        }, fail("top"));
        return () => unsub();
      }, [lib, tS, tT]);

      // 3) jumlah total (murah: ±1 read per 1000 dokumen)
      useEffect(() => {
        if (!lib || !lib.getCountFromServer) return;
        let alive = true;
        const end = dayPlus(today, WINDOW_DAYS);
        const base = (s, t) => lib.query(col(lib), lib.where("rawDate", ">=", today), lib.where("rawDate", "<=", end), ...filt(lib, s, t));
        const unfiltered = cS === "ALL" && cT === "ALL";
        const run = () => {
          lib.getCountFromServer(base("ALL", "ALL"))
            .then(r => { if (!alive) return; const n = r.data().count; setTotalAll(n); if (unfiltered) setTotal(n); })
            .catch(() => {});
          if (!unfiltered) {
            lib.getCountFromServer(base(cS, cT))
              .then(r => { if (alive) setTotal(r.data().count); })
              .catch(err => { if (alive) { setTotal(null); fail("count")(err); } });
          }
        };
        if (!unfiltered) setTotal(null);
        run();
        const t = setInterval(run, 10 * 60e3);
        return () => { alive = false; clearInterval(t); };
      }, [lib, today, cS, cT]);

      // 4) pencarian nama tim di server (awalan nama, tak peduli huruf besar/kecil) — selain filter sisi klien
      useEffect(() => {
        const raw = search.trim();
        if (!lib || raw.length < 3) { setSearchDocs(p => (p.length ? [] : p)); return; }
        let alive = true;
        const t = setTimeout(() => {
          const jobs = [];
          Array.from(new Set([raw, titleCase(raw)])).forEach(v => ["home", "away"].forEach(f => {
            jobs.push(lib.getDocs(lib.query(col(lib), lib.where(f, ">=", v), lib.where(f, "<=", v + "\uf8ff"), lib.limit(SEARCH_LIMIT))).catch(() => null));
          }));
          Promise.all(jobs).then(snaps => {
            if (!alive) return;
            const lists = snaps.filter(Boolean).map(docsToGames);
            setSearchDocs(mergeUnique(...lists));
          });
        }, 500);
        return () => { alive = false; clearTimeout(t); };
      }, [lib, search]);

      const filtersOn = sport !== "ALL" || stateF !== "ALL";
      const totalOut = filtersOn ? (noIndex[key + "|count"] ? null : total) : totalAll;
      return { feed, topPool, topReady, searchDocs, total: totalOut, totalAll, hasMore: !DEMO_MODE && more, loadMore, catalog, status };
    }

    class ErrorBoundary extends React.Component {
      constructor(p) { super(p); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err }; }
      componentDidCatch(err) { console.error("[Varsity Bowl] render error:", err); }
      render() {
        return this.state.err
          ? <div className="min-h-screen flex items-center justify-center text-gray-600 p-10 text-center">Something went wrong. Please refresh the page.</div>
          : this.props.children;
      }
    }

    // ============================================================
    // APP
    // ============================================================
    function App() {
      const [sport, setSport] = useState("ALL");
      const [rankSport, setRankSport] = useState("FOOTBALL");
      const [stateFilter, setStateFilter] = useState("ALL");
      const [liveOnly, setLiveOnly] = useState(false);
      const [search, setSearch] = useState("");
      const [visible, setVisible] = useState(PAGE_SIZE);
      const [today, setToday] = useState(pacificDay(0));
      const [nowMs, setNowMs] = useState(Date.now());
      const { feed, topPool, topReady, searchDocs, total, totalAll, hasMore, loadMore, catalog, status } =
        useGames(sport, stateFilter, today, search);

      useEffect(() => {
        const t = setInterval(() => setToday(pacificDay(0)), 10 * 60 * 1000);
        return () => clearInterval(t);
      }, []);
      useEffect(() => {
        const t = setInterval(() => setNowMs(Date.now()), 60 * 1000);
        return () => clearInterval(t);
      }, []);
      useEffect(() => { setVisible(PAGE_SIZE); }, [sport, stateFilter, search, liveOnly]);

      const scrollToSchedule = () => {
        const el = document.getElementById("schedule");
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      // Mulai mengetik → lompat ke hasil (kolom search ada di header sticky, jadi tetap terlihat)
      const scrolledForQuery = React.useRef(false);
      useEffect(() => {
        if (!search.trim()) { scrolledForQuery.current = false; return; }
        if (scrolledForQuery.current) return;
        const t = setTimeout(() => { scrolledForQuery.current = true; scrollToSchedule(); }, 450);
        return () => clearTimeout(t);
      }, [search]);

      // Window tanggal (sama dengan query server): hari ini s/d WINDOW_DAYS ke depan
      const endDay = useMemo(() => dayPlus(today, WINDOW_DAYS), [today]);
      const inWin = (g) => DEMO_MODE || !g.rawDate || (g.rawDate >= today && g.rawDate <= endDay);

      const qTokens = useMemo(() => norm(search).split(" ").filter(t => t && t !== "vs" && t !== "v"), [search]);
      const searching = qTokens.length > 0;

      const feedUp = useMemo(() => feed.filter(inWin), [feed, today, endDay]);
      const listUp = useMemo(() => (searching && searchDocs.length)
        ? mergeUnique(feedUp, searchDocs.filter(inWin)) : feedUp, [feedUp, searchDocs, searching, today, endDay]);
      const poolUp = useMemo(() => mergeUnique(listUp, topPool.filter(inWin)), [listUp, topPool, today, endDay]);

      // Pil olahraga: yang sedang ada gamenya dulu (urut kemunculan), lalu daftar dasar (mis. di luar musim)
      const sportList = useMemo(() => {
        const seen = Object.keys(catalog.sports).sort((a, b) => catalog.sports[b] - catalog.sports[a] || a.localeCompare(b));
        return [...seen, ...SPORT_BASE.filter(s => !catalog.sports[s])];
      }, [catalog]);
      const pills = useMemo(() => ["ALL", ...sportList, ...(sport !== "ALL" && !sportList.includes(sport) ? [sport] : [])], [sportList, sport]);

      // Semua negara bagian selalu tersedia (data diambil per filter di server, bukan dari sampel yang dimuat)
      const stateOptions = useMemo(() => Object.keys(STATE_NAMES)
        .map(code => ({ code, name: STATE_NAMES[code] })).sort((a, b) => a.name.localeCompare(b.name)), []);
      const quickStates = useMemo(() => Object.keys(catalog.states)
        .sort((a, b) => catalog.states[b] - catalog.states[a] || a.localeCompare(b)).slice(0, 6)
        .map(code => ({ code, name: STATE_NAMES[code] })), [catalog]);

      const hayOf = (g) => norm([g.home, g.away, g.homeFull, g.awayFull, g.location, g.league,
                                 g.sport, g.gender, g.gameType, g.state, STATE_NAMES[g.state]].join(" "));
      const listIndex = useMemo(() => listUp.map(g => ({ g, hay: hayOf(g) })), [listUp]);
      const poolIndex = useMemo(() => poolUp.map(g => ({ g, hay: hayOf(g) })), [poolUp]);

      const liveClock = liveOnly ? nowMs : 0;   // jam hanya memicu hitung ulang saat filter LIVE aktif
      const passes = ({ g, hay }) =>
        (sport === "ALL" || g.sport === sport) &&
        (stateFilter === "ALL" || g.state === stateFilter) &&
        (!liveOnly || gameState(g, nowMs) === "live") &&
        qTokens.every(t => hay.includes(t));
      const filtered = useMemo(() => listIndex.filter(passes).map(x => x.g),
        [listIndex, sport, stateFilter, qTokens, liveOnly, liveClock]);

      // Top 10 diambil dari kandidat prestige tertinggi (bukan hanya halaman jadwal yang termuat)
      const topGames = useMemo(() => poolIndex.filter(passes).map(x => x.g).sort(byPrestige).slice(0, 10),
        [poolIndex, sport, stateFilter, qTokens, liveOnly, liveClock]);
      const schedule = useMemo(() => [...filtered].sort(byDate), [filtered]);
      const shown = schedule.slice(0, visible);

      const clientOnly = searching || liveOnly;          // filter yang tidak bisa dihitung server
      const partial = hasMore;                           // masih ada halaman yang belum dimuat → angka lokal = minimal
      const gamesN = (!clientOnly && total != null) ? total : filtered.length;
      const gamesPlus = !(!clientOnly && total != null) && partial;

      // Kartu hero mengikuti filter yang aktif (sport / state / pencarian)
      const stats = useMemo(() => {
        const teams = new Set(), sports = new Set();
        filtered.forEach(g => {
          teams.add(g.homeFull || g.home); teams.add(g.awayFull || g.away);
          if (g.sport) sports.add(g.sport);
        });
        return { sports: sports.size, teams: teams.size, games: filtered.length };
      }, [filtered]);

      // Game yang sedang LIVE — definisi sama dengan badge "● LIVE" di baris jadwal (30 menit sebelum kickoff s/d 3 jam sesudahnya)
      const liveBySport = useMemo(() => {
        const c = {};
        feedUp.forEach(g => { if (g.sport && gameState(g, nowMs) === "live") c[g.sport] = (c[g.sport] || 0) + 1; });
        return c;
      }, [feedUp, nowMs]);
      const liveTotal = useMemo(() => Object.values(liveBySport).reduce((a, b) => a + b, 0), [liveBySport]);
      // Angka kartu "Sports Live" mengikuti filter yang aktif
      const liveView = useMemo(() => {
        const sports = new Set(); let games = 0, next = null;
        filtered.forEach(g => {
          const st = gameState(g, nowMs);
          if (st === "live") { games++; if (g.sport) sports.add(g.sport); }
          else if (st === "upcoming") { const t = gameStartMs(g); if (t != null && (next == null || t < next.t)) next = { t, g }; }
        });
        return { sports: sports.size, games, nextLabel: next ? startLabel(next.g, nowMs).toLowerCase() : "" };
      }, [filtered, nowMs]);
      const [showSports, setShowSports] = useState(false);
      const focusSearch = () => {
        const el = Array.from(document.querySelectorAll('input[aria-label="Search games"]')).find(i => i.offsetParent !== null);
        if (el) el.focus();
      };

      // SHOW MORE: tampilkan lebih banyak; bila yang termuat hampir habis, ambil halaman berikutnya dari Firestore
      const remaining = schedule.length - visible;
      const onMore = () => {
        setVisible(v => v + PAGE_SIZE);
        if (hasMore && remaining <= PAGE_SIZE * 2) loadMore();
      };
      const moreLabel = (!clientOnly && total != null)
        ? `SHOW MORE (${Math.max(total - visible, 0)} REMAINING)`
        : (hasMore ? "SHOW MORE" : `SHOW MORE (${remaining} REMAINING)`);

      const hasFilters = search.trim() !== "" || sport !== "ALL" || stateFilter !== "ALL" || liveOnly;
      const resetFilters = () => { setSearch(""); setSport("ALL"); setStateFilter("ALL"); setLiveOnly(false); };

      const upcomingN = totalAll != null ? totalAll : feedUp.length;
      const upcomingPlus = totalAll == null && hasMore;
      const badgeKey = status === "live" ? "live" : status;
      const badgeText =
        status === "live"       ? (upcomingN > 0 ? `LIVE • ${fmtN(upcomingN, upcomingPlus)} UPCOMING GAMES` : "NO UPCOMING GAMES RIGHT NOW")
        : status === "error"    ? "CAN'T LOAD GAMES • TRY AGAIN SOON"
        : status === "demo"     ? "DEMO MODE • SAMPLE DATA"
        : "CONNECTING…";
      const emptyMsg =
        status === "connecting" ? "Loading games…"
        : status === "error"    ? "We couldn't load games right now. Please try again in a minute."
        : liveOnly ? "No games are live right now. Try CLEAR ALL above."
        : hasFilters ? "No games match your search or filters. Try CLEAR ALL above." : "No upcoming games right now.";
      const topEmptyMsg = (!topReady && status !== "error" && status !== "demo") ? "Loading games…" : emptyMsg;
      const num = (n) => status === "connecting" ? "…" : n;

      const goSport = (s) => (e) => {
        e.preventDefault(); setSport(s);
        const el = document.getElementById("schedule"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });

          if((u.protocol==="http:"||u.protocol==="https:") && u.host!==location.host){
            a.target="_blank"; a.rel="noopener noreferrer";
          }
        } catch(e){}
      }
      function s(){ document.querySelectorAll("a[href]").forEach(m); }
      if(document.readyState!=="loading"){ s(); } else { document.addEventListener("DOMContentLoaded",s); }
      document.addEventListener("click",function(e){
        var a=e.target&&e.target.closest&&e.target.closest("a[href]");
        if(a){ m(a); }
      },true);
    })();
  </script>
